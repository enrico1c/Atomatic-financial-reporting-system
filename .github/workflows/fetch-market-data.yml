name: Fetch Market Data

on:
  schedule:
    # Every 5 min Mon–Fri, 13:00–21:00 UTC  (covers 9 am–4 pm ET + buffer)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:   # allow manual trigger any time

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push data/market.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch market data
        run: python scripts/fetch_market.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update market data [skip ci]"
          git push
